server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;

  # Archivos del build con hash en el nombre: cambian de nombre en cada deploy,
  # así que se cachean un año. Si falta uno (página vieja que pide el JS de un
  # deploy anterior), 404 y no index.html: devolver HTML con nombre de .js dejaba
  # la app en blanco y el navegador lo guardaba en caché.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Página, sw.js, config.json, manifest e imágenes: el navegador revalida antes
  # de usarlos (304 si no cambiaron), así un deploy se ve en la próxima apertura.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
